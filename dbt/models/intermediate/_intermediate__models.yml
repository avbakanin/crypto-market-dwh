version: 2

models:
  - name: int_binance__hourly_returns
    description: >
      Spot hours with 1h and 4h close-to-close returns (NULL across a hole in the grid),
      the return z-score against the trailing 30 days and volume baselines over the
      trailing 7 days. Baselines exclude the current hour.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, open_time_ms]
    columns:
      - name: symbol
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_symbol')
                field: symbol
      - name: open_time_ms
        data_tests: [not_null]
      - name: return_1h
        description: close / previous close - 1; NULL when the previous hour is missing.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> -1"
      - name: return_zscore
        description: >
          (return_1h - mean) / stddev over the trailing return_zscore_window_hours,
          NULL until return_zscore_min_hours of history.
      - name: quote_volume_baseline
        description: Mean quote volume of the trailing volume_baseline_hours (full window only).
      - name: log_volume_zscore
        description: >
          z-score of ln(quote_volume) against the trailing volume_baseline_hours. Raw
          volume has a heavy tail; its z-score flags ~1800 hours a year, this one ~24.
        data_tests:
          # Anomalous volume: a data error or a pump. Warn, read the list.
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= 5"
              config:
                severity: warn
                store_failures_as: table
                alias: dq_volume_anomaly

  - name: int_binance__hourly_market
    description: >
      int_binance__hourly_returns plus the futures market at the end of each hour: open
      interest snapshot at hour_end, the last funding settlement at or before hour_end
      (ASOF join), the three long/short ratios at hour_end. Open interest and the ratios
      exist for the last ~30 days only.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, open_time_ms]
    columns:
      - name: symbol
        data_tests: [not_null]
      - name: open_time_ms
        data_tests:
          - not_null
          - complete_daily_row_count:
              arguments:
                partition_by: symbol
                series_model: ref('dim_symbol')
              config:
                severity: warn
                store_failures_as: table
                alias: dq_market_daily_row_count
      - name: open_interest_coins
        description: Open interest in coins at hour_end; NULL outside the ~30-day history.
      - name: top_account_long_short_ratio
        description: >
          Long/short accounts of the top 20% traders by margin balance at hour_end; NULL
          outside the ~30-day history.
      - name: top_position_long_short_ratio
        description: Long/short position size of the same top traders at hour_end.
      - name: global_account_long_short_ratio
        description: Long/short accounts of all traders at hour_end.
      - name: funding_rate
        description: Rate of the last settlement at or before hour_end, per settlement.
      - name: funding_rate_8h
        description: funding_rate * 8 / interval, comparable across 4 h and 8 h contracts.
      - name: funding_premium_8h
        description: funding_rate_8h - interest_rate_8h, the departure from the calm rate.
      - name: is_funding_stale
        description: >
          The next settlement was due by hour_end and is not there (missed by the
          platform, or not published yet at the tail). NULL before the funding history.
